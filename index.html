<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coinpath — where did the money go?</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%230e7c66%22/%3E%3C/svg%3E">
  <meta name="description" content="Follow a payment in a blockchain, in your browser: each step, why, and where it ends.">
  <style>
    /* COINPATH'S LOOK: the page's own presentation over okay-faces' classes. The program says what is on a screen;
       this says how it looks and where it sits — nothing here is content. */
    :root:root {
      --okay-fg: #16211d; --okay-bg: #f4f7f6; --okay-muted: #5b6b66; --okay-surface: #ffffff; --okay-border: #d5dfdb;
      --okay-accent: #0e7c66; --okay-warning: #9a6700; --okay-problem: #c42b2b;
      --okay-font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --okay-mono: ui-monospace, "SF Mono", Menlo, monospace;
      --okay-size: 17px; --okay-space: 8px; --okay-measure: 980px;
    }
    html, body { background: var(--okay-bg); margin: 0; }
    header { background: #0b3d33; color: #e7f3ef; }
    header .bar { max-width: var(--okay-measure); margin: 0 auto; padding: 14px 16px; box-sizing: border-box; display: flex; align-items: baseline;
      gap: 12px; font: 15px/1.4 var(--okay-font); }
    header .brand { font-weight: 800; letter-spacing: 0.14em; font-size: 17px; color: #ffffff; text-decoration: none; }
    header .brand:hover { color: #bfe8dc; }
    footer { border-top: 1px solid var(--okay-border); color: var(--okay-muted); }
    footer .bar { max-width: var(--okay-measure); margin: 0 auto; padding: 20px 16px 36px; box-sizing: border-box;
      font: 14px/1.6 var(--okay-font); }
    footer a { color: var(--okay-accent); font-weight: 600; }
    /* the answer's "Follow another" at the top: a link to the page's start, drawn as the button below it */
    .okay-link[href="./"] { align-self: flex-start; display: inline-block; text-decoration: none; padding: 10px 18px;
      border-radius: 10px; background: var(--okay-surface); border: 1px solid var(--okay-border); }
    .okay-link[href="./"]:hover { border-color: var(--okay-accent); }
    header .tag { color: #a9d3c7; }

    .okay-face { padding: 28px 16px 48px; gap: 20px; }
    .okay-heading-1 { font-size: 2.1em; letter-spacing: -0.02em; line-height: 1.15; }
    .okay-group-title { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.78em; margin-top: 8px; }
    .okay-link { color: var(--okay-accent); font-weight: 600; }

    /* cards: a form, a table, a notice */
    .okay-form { background: var(--okay-surface); border: 1px solid var(--okay-border); border-radius: 14px;
      box-shadow: 0 1px 2px rgba(16, 40, 34, 0.06), 0 8px 24px rgba(16, 40, 34, 0.06); padding: 24px; gap: 16px; }
    .okay-form fieldset { border: 0; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(150px, 1fr) 4fr;
      gap: 16px; }
    .okay-field { align-items: stretch; gap: 6px; }
    .okay-label { font-size: 0.85em; color: var(--okay-muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .okay-form input, .okay-form select { font: 18px/1.3 var(--okay-font); padding: 12px 14px; width: 100%;
      box-sizing: border-box; border: 1px solid var(--okay-border); border-radius: 10px; background: #fbfdfc; }
    .okay-form input { font-family: var(--okay-mono); }
    .okay-form input:focus, .okay-form select:focus { outline: 3px solid rgba(14, 124, 102, 0.25);
      border-color: var(--okay-accent); }
    .okay-doc { font-size: 0.85em; }
    .okay-action { border-radius: 10px; padding: 12px 20px; transition: filter 0.12s; }
    .okay-action:hover { filter: brightness(1.1); }
    .okay-form .okay-action { font-size: 18px; padding: 14px 24px; align-self: flex-start; min-width: 200px; }
    .okay-problems { font-weight: 600; }

    .okay-table { background: var(--okay-surface); border-radius: 12px; overflow: hidden; width: 100%;
      border: 1px solid var(--okay-border); font-size: 0.92em; }
    .okay-table th { background: #e9f1ee; text-align: left; font-size: 0.85em; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--okay-muted); }
    .okay-table th, .okay-table td { border: 0; border-bottom: 1px solid var(--okay-border); padding: 10px 12px; }
    .okay-table tr:nth-child(even) td { background: #f7faf9; }
    td { overflow-wrap: break-word; word-break: normal; }
    .okay-notice-info { border-radius: 10px; border: 1px solid var(--okay-border); }
    .okay-notice-warning, .okay-notice-problem { border-radius: 10px; background: #fffaf0; }

    /* THE FORM SCREEN'S ORDER: the form first, then the examples with their title on a line of their own, then how
       it works — the same parts the program gives, placed by the page */
    .okay-face > div:has(form[data-action="follow"]) { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px 12px; align-items: start; }
    .okay-face > div:has(form[data-action="follow"]) > .okay-view,
    .okay-face > div:has(form[data-action="follow"]) > .okay-view > .okay-group,
    .okay-face > div:has(form[data-action="follow"]) > .okay-actions { display: contents; }
    .okay-face > div:has(form[data-action="follow"]) > .okay-view > .okay-group > *,
    .okay-face > div:has(form[data-action="follow"]) > .okay-actions > form { grid-column: 1 / -1; }
    .okay-face > div:has(form[data-action="follow"]) > .okay-actions > form { order: 1; margin: 8px 0 12px; }
    .okay-face > div:has(form[data-action="follow"]) > .okay-view > .okay-group > .okay-group:nth-of-type(1) { order: 2; }
    .okay-face > div:has(form[data-action="follow"]) > .okay-actions > button { order: 3; background: var(--okay-surface);
      color: var(--okay-accent); border: 1px solid var(--okay-border); box-shadow: 0 1px 2px rgba(16, 40, 34, 0.05);
      text-align: left; }
    .okay-face > div:has(form[data-action="follow"]) > .okay-view > .okay-group > .okay-group:nth-of-type(2) { order: 4;
      margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--okay-border); }
    .okay-face > div:has(form[data-action="follow"]) > .okay-view > .okay-group > p { color: var(--okay-muted); }
    .okay-face > div:has(form[data-action="follow"]) > .okay-view > .okay-group > h1 + p { color: var(--okay-fg);
      font-size: 1.15em; }

    /* WHILE IT SEARCHES: a screen with no actions is the program working (okay-ui's `working`) — a spinner where its
       actions would be */
    .okay-actions:empty { display: flex; align-items: center; gap: 14px; min-height: 56px; }
    .okay-actions:empty::before { content: ""; width: 34px; height: 34px; flex: none; border-radius: 50%;
      border: 4px solid #cfe3dd; border-top-color: var(--okay-accent); animation: coinpath-spin 0.8s linear infinite; }
    .okay-actions:empty::after { content: "Reading the chain…"; color: var(--okay-muted); }
    @keyframes coinpath-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .okay-actions:empty::before { animation-duration: 2.4s; } }

    @media (max-width: 640px) {
      .okay-form fieldset { grid-template-columns: 1fr; }
      .okay-face > div:has(form[data-action="follow"]) { grid-template-columns: 1fr; }
      .okay-heading-1 { font-size: 1.7em; }
    }
  </style>
</head>
<body>
  <header><div class="bar"><a class="brand" href="./" title="Back to the start">COINPATH</a><span class="tag">follow a payment in a blockchain</span></div></header>
  <div id="app"></div>
  <footer><div class="bar">
    Built on <a href="https://github.com/okay-effects" target="_blank" rel="noopener noreferrer">okay-effects</a> —
    algebraic effects for Scala
  </div></footer>
  <!-- the page, linked by Scala.js: `sbt appJS/web` puts main.js, labels/ and examples/ here -->
  <script src="main.js"></script>
</body>
</html>
